<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VaultOTP</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main class="popup">
      <section class="section">
        <div class="title-row">
          <h1 data-i18n="authTitle"></h1>
          <div class="language-switch" data-i18n-aria-label="language">
            <button type="button" data-locale="zh-CN" data-i18n="localeZh"></button>
            <button type="button" data-locale="en" data-i18n="localeEn"></button>
          </div>
          <button id="save-settings" type="button" data-i18n="save"></button>
        </div>
        <label class="field">
          <span data-i18n="serviceUrl"></span>
          <input id="service-url" autocomplete="off" data-i18n-placeholder="serviceUrlPlaceholder" />
        </label>
        <label class="field">
          <span data-i18n="pat"></span>
          <input id="pat" autocomplete="off" type="password" />
        </label>
        <div id="message" class="message"></div>
      </section>

      <section class="section">
        <div class="title-row">
          <h2 data-i18n="entries"></h2>
          <button id="refresh-entries" type="button" data-i18n="refresh"></button>
        </div>
        <input id="search" autocomplete="off" data-i18n-placeholder="searchPlaceholder" />
        <div id="entries" class="entry-list"></div>
      </section>

      <section class="section">
        <div class="title-row">
          <h2 data-i18n="importEntries"></h2>
          <button id="scan-page" type="button" data-i18n="scanPage"></button>
        </div>
        <textarea id="import-text" data-i18n-placeholder="importOtpAuthPlaceholder"></textarea>
        <div class="button-row">
          <button id="preview-import" type="button" data-i18n="previewImport"></button>
          <button id="import-valid" type="button" data-i18n="importValid"></button>
        </div>
        <div id="import-preview" class="import-preview"></div>
      </section>
    </main>
    <script src="./i18n.js"></script>
    <script src="./popup.js"></script>
  </body>
</html>
